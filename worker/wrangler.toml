name = "scryfall-zoekhulp"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# At most 20 translations per minute per visitor (IP address).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# The cost overview (/stats): cheap, so a higher limit.
[[ratelimits]]
name = "LOG_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

# Syncing between devices (/sync).
[[ratelimits]]
name = "SYNC_LIMITER"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

# Keeps the prompt cache warm (see scheduled() in src/index.js): every 30 minutes from 09:00 to 22:59 UTC,
# which is 10:00–00:00 Dutch winter time (11:00–01:00 in summer). Costs roughly $0.01 a day.
[triggers]
crons = ["*/30 9-22 * * *"]

# Shared search log (table in schema.sql).
[[d1_databases]]
binding = "DB"
database_name = "zoekhulp-log"
database_id = "f67c431b-7d76-43cd-9ce4-982740285f97"

# Secrets, set with "npx wrangler secret put <NAME>" (never stored in this file or on GitHub):
#   ANTHROPIC_API_KEY  the Claude API key
#   ACCESS_CODE        the code you give to friends
